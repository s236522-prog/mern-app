
services:
  backend:
    build:
      context: ./server
    container_name: mern-backend-compose
    ports:
      - "5001:5000"
    env_file:
      - ./server/.env
    networks:
      - mern-network

  frontend:
    build:
      context: ./client
    container_name: mern-frontend-compose
    ports:
      - "4173:4173"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge
